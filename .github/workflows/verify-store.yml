name: Verify Store connection (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-store.yml
      - scripts/verify_store_connection.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate and verify the existing product without modifying submissions
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUCT: ${{ vars.MSSTORE_PRODUCT_ID }}
          IDENTITY: ${{ vars.MSSTORE_IDENTITY_JSON }}
        run: python3 scripts/verify_store_connection.py

