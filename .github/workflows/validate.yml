name: Validate pull request (no publishing)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photos-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: x64
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate backend without live accounts
        shell: pwsh
        run: |
          foreach($test in 'test_portability.py','test_confirmations.py','test_migration.py','test_service.py','test_supervisor.py','test_reconciliation.py','test_compare_originals.py','test_automatic_command.py','test_discovery_notifications.py','test_distribution_audit.py','test_general_readiness.py','test_runtime_dependencies.py') {
            python $test
            if($LASTEXITCODE -ne 0){throw "Failed: $test"}
          }
      - name: Verify startup state mapping without changing registration
        shell: pwsh
        run: |
          dotnet run --project StartupTests/StartupTests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Startup state regression'}
      - name: Build isolated native candidates
        shell: pwsh
        run: |
          foreach($arch in 'x64','arm64') {
            dotnet publish PhotosNative/PhotosNative.csproj -c Release -r "win-$arch" --self-contained true -o "artifacts/native-$arch"
            if($LASTEXITCODE -ne 0){throw 'Candidate build failed'}
          }
          $head=git rev-parse HEAD
          @{commit=$head;purpose='Isolated --verify --inspect only; not an installer or a release';startupEnabled=$false;uploadsAllowed=$false} | ConvertTo-Json | Set-Content artifacts/native-x64/candidate.json
          Get-ChildItem artifacts/native-x64 -File -Recurse | ForEach-Object { $hash=Get-FileHash $_.FullName; "$($hash.Hash.ToLower())  $($_.FullName.Substring((Resolve-Path artifacts/native-x64).Path.Length+1))" } | Set-Content artifacts/native-x64/SHA256SUMS.txt
      - name: Verify isolated native layout and appearance keyboard focus
        shell: pwsh
        run: |
          $qa=Join-Path $env:RUNNER_TEMP ('photos-ui-'+[guid]::NewGuid().ToString('N'))
          "PHOTOS_QA_DIR=$qa" >> $env:GITHUB_ENV
          New-Item -ItemType Directory (Join-Path $qa 'data') -Force | Out-Null
          '{"photos_roots":[],"auto_monitor_enabled":false}' | Set-Content (Join-Path $qa 'config.json')
          $env:GOOGLE_PHOTOS_HOME=$qa
          $exe=(Resolve-Path artifacts/native-x64/GooglePhotosWidget.exe).Path
          $process=Start-Process -FilePath $exe -ArgumentList '--verify' -PassThru
          if(-not $process.WaitForExit(60000)){throw 'Isolated native verification timed out'}
          $report=Get-Content (Join-Path $qa 'data/native-verification.json') -Raw
          Write-Output $report
          if($process.ExitCode -ne 0 -or -not ($report | ConvertFrom-Json).Passed){throw 'Native UI regression'}
      - name: Preserve isolated UI reports and screenshots even on failure
        if: ${{ always() && env.PHOTOS_QA_DIR != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: photos-native-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.PHOTOS_QA_DIR }}/data/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload test-only x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: photos-native-test-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/native-x64/
          retention-days: 7
